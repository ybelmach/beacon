global:
  scrape_interval: 5s
  evaluation_interval: 15s
  external_labels:
    env: local

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: beacon-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8000"]
        labels:
          service: backend

  - job_name: beacon-consumers
    metrics_path: /metrics
    static_configs:
      - targets:
          - "consumer-storage:9100"
          - "consumer-alerting:9100"

  - job_name: clickhouse
    metrics_path: /metrics
    static_configs:
      - targets: ["clickhouse:9363"]
